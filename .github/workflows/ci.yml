name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - name: Unchanged snapshot passes
        run: mcp-changecheck examples/before.json examples/before.json
      - name: Changed snapshot can produce a JSON report
        run: mcp-changecheck examples/before.json examples/after.json --format json --fail-on never
