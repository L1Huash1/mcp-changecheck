[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-changecheck"
version = "0.2.1"
description = "Offline, explainable change checks for MCP tool snapshots"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "L1Huash1"}]
keywords = ["mcp", "agents", "tools", "ci", "schema", "diff"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]

[project.scripts]
mcp-changecheck = "mcp_changecheck.cli:main"

[project.urls]
Repository = "https://github.com/L1Huash1/mcp-changecheck"
Issues = "https://github.com/L1Huash1/mcp-changecheck/issues"

[tool.setuptools.packages.find]
where = ["src"]
